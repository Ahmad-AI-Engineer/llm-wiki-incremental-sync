<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect Odoo</title>
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <main class="card">
      <div class="card-head">
        <div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <h1>Connect Odoo</h1>
        <p class="target">{url}</p>
      </div>

      <div class="card-body">
        {message}

        <form method="post" action="/login">
          <label class="label" for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            value="{username}"
            autocomplete="username"
            spellcheck="false"
            required
          />

          <label class="label" for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Your Odoo password"
            required
            autofocus
          />

          <button type="submit">Authenticate</button>
          <p class="note">
            Used once to mint a session token. The password is never stored.
          </p>
        </form>
      </div>
    </main>
  </body>
</html>
